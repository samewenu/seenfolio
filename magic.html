<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Check your inbox — Seenfolio</title>
<link rel="stylesheet" href="styles.css" />
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
.shell { max-width: 480px; width: 100%; background: var(--bg-card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); padding: 48px 44px; text-align: center; }
.shell .brand { margin: 0 auto 22px; justify-content: center; }
.sage-wrap { width: 200px; height: 200px; margin: 0 auto 14px; }
.shell h1 { font-family: var(--font-sans); font-size: 32px; font-variation-settings: "wght" 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 12px; }
.shell h1 em { font-style: normal; background: var(--yellow); padding: 0 6px; }
.shell p { font-family: var(--font-sans); font-size: 16px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 28px; }
.shell p strong { color: var(--ink); font-variation-settings: "wght" 700; }
.btn { width: 100%; justify-content: center; padding: 14px; font-size: 15px; margin-bottom: 12px; }
.resend { font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); }
.resend a { color: var(--accent); border-bottom: 1.5px solid var(--accent); }
</style>
</head>
<body>
<main class="shell">
  <a class="brand" href="index.html">
    <div class="brand-mark"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><ellipse cx="9" cy="11" rx="7" ry="9.5" fill="#FFD202"/><ellipse cx="21" cy="11" rx="8.5" ry="10.5" fill="#FFD202"/></svg></div>
    <div class="brand-name">Seenfolio</div>
  </a>
  <div class="sage-wrap"><svg viewBox="0 0 220 220" width="100%"><use href="sage.svg#sage-wave"/></svg></div>
  <h1>Check your <em>inbox</em>.</h1>
  <p>I sent a magic link to <strong>amara@silverjewelry.com</strong>. Click it to sign in — expires in 15 minutes.</p>
  <a href="app.html" class="btn primary">Pretend I clicked it →</a>
  <p class="resend">Didn't arrive? <a href="#">Resend</a> · or <a href="sign-in.html">use password instead</a></p>
</main>
</body>
</html>
