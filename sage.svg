<?xml version="1.0" encoding="UTF-8"?>
<!--
  SeenFolio — Sage the Owl mascot library
  12 contextual poses defined as reusable <symbol> elements.
  Embed: <svg><use href="sage.svg#sage-wave" /></svg>

  Sage's palette:
    outline:  #151515
    feathers: #C9A46B  (warm tan)
    chest:    #F5E6C9  (cream)
    accent:   #F54E00  (orange beak / feet / band)
    eye:      #FAF9F4
    pupil:    #151515
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ════════ DEFS — reused shapes ════════ -->
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <g id="sage-base">
      <!-- body (oval) -->
      <ellipse cx="100" cy="115" rx="58" ry="68" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- belly patch -->
      <ellipse cx="100" cy="130" rx="38" ry="44" fill="#F5E6C9"/>
      <!-- ear tufts -->
      <path d="M 60 60 Q 52 38 68 52" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 140 60 Q 148 38 132 52" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- eye whites -->
      <circle cx="78" cy="88" r="24" fill="#FAF9F4" stroke="#151515" stroke-width="3.5"/>
      <circle cx="122" cy="88" r="24" fill="#FAF9F4" stroke="#151515" stroke-width="3.5"/>
      <!-- pupils -->
      <circle cx="80" cy="90" r="11" fill="#151515"/>
      <circle cx="124" cy="90" r="11" fill="#151515"/>
      <!-- eye highlights -->
      <circle cx="85" cy="86" r="3.5" fill="#FFFFFF"/>
      <circle cx="129" cy="86" r="3.5" fill="#FFFFFF"/>
      <!-- beak -->
      <path d="M 92 105 L 100 118 L 108 105 Z" fill="#F54E00" stroke="#151515" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- chest feather lines (decorative) -->
      <path d="M 90 145 Q 100 150 110 145" fill="none" stroke="#C9A46B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 88 155 Q 100 161 112 155" fill="none" stroke="#C9A46B" stroke-width="2" stroke-linecap="round"/>
      <!-- feet -->
      <g stroke="#F54E00" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M 82 180 L 76 192 M 82 180 L 84 194 M 82 180 L 90 192"/>
        <path d="M 118 180 L 112 192 M 118 180 L 116 194 M 118 180 L 124 192"/>
      </g>
    </g>
    <g id="sage-base-tucked">
      <!-- like sage-base but wings tucked: adds the side-wing arcs -->
      <use href="#sage-base"/>
      <path d="M 48 110 Q 38 140 60 168" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 152 110 Q 162 140 140 168" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ════════ POSE 1 · SAGE WAVING ════════ -->
  <symbol id="sage-wave" viewBox="0 0 220 220">
    <!-- left wing tucked -->
    <path d="M 48 110 Q 38 145 62 172" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <use href="#sage-base"/>
    <!-- right wing extended for wave -->
    <path d="M 155 95 Q 185 60 198 35" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 158 102 Q 188 70 200 42" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <!-- wing fan (feather lines) -->
    <path d="M 195 38 Q 200 30 205 36" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 198 42 Q 205 36 210 42" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round"/>
    <!-- friendly motion mark -->
    <path d="M 200 28 Q 205 22 210 28" fill="none" stroke="#F54E00" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- ════════ POSE 2 · CONTROL PANEL (7 buttons) ════════ -->
  <symbol id="sage-controls" viewBox="0 0 360 220">
    <!-- control panel behind -->
    <rect x="180" y="100" width="170" height="85" rx="10" fill="#FAF9F4" stroke="#151515" stroke-width="3.5"/>
    <!-- 7 buttons (3 across, 3 across, 1 below) -->
    <g>
      <circle cx="205" cy="125" r="11" fill="#F54E00" stroke="#151515" stroke-width="2.5"/>
      <circle cx="240" cy="125" r="11" fill="#F9BD2B" stroke="#151515" stroke-width="2.5"/>
      <circle cx="275" cy="125" r="11" fill="#29DBBB" stroke="#151515" stroke-width="2.5"/>
      <circle cx="310" cy="125" r="11" fill="#1D4AFF" stroke="#151515" stroke-width="2.5"/>
      <circle cx="205" cy="160" r="11" fill="#EF4444" stroke="#151515" stroke-width="2.5"/>
      <circle cx="240" cy="160" r="11" fill="#C9A46B" stroke="#151515" stroke-width="2.5"/>
      <circle cx="275" cy="160" r="11" fill="#F5E6C9" stroke="#151515" stroke-width="2.5"/>
    </g>
    <!-- screen at top -->
    <rect x="195" y="65" width="140" height="28" rx="4" fill="#151515"/>
    <text x="265" y="84" font-family="JetBrains Mono, monospace" font-size="11" fill="#F9BD2B" text-anchor="middle">ALL SYSTEMS OK</text>
    <!-- sage on the left -->
    <g transform="translate(-30 0)">
      <path d="M 48 110 Q 38 145 62 172" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <use href="#sage-base"/>
      <!-- right wing reaching to panel -->
      <path d="M 155 100 Q 175 105 195 130" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 158 108 Q 178 113 195 138" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- ════════ POSE 3 · AT A DESK ════════ -->
  <symbol id="sage-desk" viewBox="0 0 320 230">
    <!-- monitor -->
    <rect x="155" y="50" width="130" height="90" rx="6" fill="#151515" stroke="#151515" stroke-width="3.5"/>
    <rect x="163" y="58" width="114" height="74" rx="3" fill="#FAF9F4"/>
    <!-- chart lines in screen -->
    <path d="M 170 110 L 185 95 L 200 100 L 215 80 L 230 85 L 245 70 L 265 65" fill="none" stroke="#F54E00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="265" cy="65" r="3.5" fill="#F54E00"/>
    <!-- monitor stand -->
    <path d="M 215 140 L 215 160 L 195 175 L 245 175 L 225 160 L 225 140" fill="#151515"/>
    <!-- desk surface -->
    <rect x="50" y="175" width="260" height="5" fill="#151515"/>
    <!-- coffee mug -->
    <rect x="160" y="153" width="22" height="20" rx="2" fill="#F54E00" stroke="#151515" stroke-width="2.5"/>
    <path d="M 182 158 Q 192 162 182 168" fill="none" stroke="#151515" stroke-width="2.5"/>
    <!-- sage seated -->
    <g transform="translate(0 35)">
      <path d="M 48 110 Q 38 138 62 165" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <use href="#sage-base"/>
      <!-- right wing reaching forward toward monitor -->
      <path d="M 152 130 Q 170 140 178 142" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- ════════ POSE 4 · MAGNIFYING GLASS ════════ -->
  <symbol id="sage-magnify" viewBox="0 0 280 220">
    <use href="#sage-base-tucked"/>
    <!-- magnifying glass in right talon -->
    <circle cx="200" cy="130" r="32" fill="none" stroke="#151515" stroke-width="4"/>
    <circle cx="200" cy="130" r="32" fill="#F9BD2B" opacity="0.15"/>
    <line x1="225" y1="155" x2="248" y2="180" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
    <!-- wing holding the glass -->
    <path d="M 152 120 Q 175 130 175 140" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <!-- highlight on glass -->
    <path d="M 188 115 Q 178 125 180 138" fill="none" stroke="#FAF9F4" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <!-- ════════ POSE 5 · CLIPBOARD ════════ -->
  <symbol id="sage-clipboard" viewBox="0 0 260 230">
    <use href="#sage-base-tucked"/>
    <!-- clipboard tucked under right wing -->
    <g transform="rotate(-8 200 145)">
      <rect x="170" y="100" width="60" height="80" rx="4" fill="#FAF9F4" stroke="#151515" stroke-width="3"/>
      <rect x="186" y="92" width="28" height="14" rx="2" fill="#151515"/>
      <!-- checklist lines -->
      <line x1="180" y1="120" x2="220" y2="120" stroke="#151515" stroke-width="2"/>
      <line x1="180" y1="135" x2="215" y2="135" stroke="#151515" stroke-width="2"/>
      <line x1="180" y1="150" x2="210" y2="150" stroke="#151515" stroke-width="2"/>
      <!-- check marks -->
      <path d="M 174 119 L 176 122 L 180 116" fill="none" stroke="#F54E00" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 174 134 L 176 137 L 180 131" fill="none" stroke="#F54E00" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- wing -->
    <path d="M 152 120 Q 170 135 175 145" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <!-- ════════ POSE 6 · FOUR KEYBOARDS (analyzing) ════════ -->
  <symbol id="sage-multitask" viewBox="0 0 360 240">
    <!-- four keyboards on a desk -->
    <rect x="60" y="180" width="240" height="6" fill="#151515"/>
    <g stroke="#151515" stroke-width="2.5" fill="#151515">
      <rect x="65" y="160" width="60" height="18" rx="2" fill="#FAF9F4"/>
      <rect x="130" y="160" width="60" height="18" rx="2" fill="#FAF9F4"/>
      <rect x="195" y="160" width="60" height="18" rx="2" fill="#FAF9F4"/>
      <rect x="260" y="160" width="60" height="18" rx="2" fill="#FAF9F4"/>
    </g>
    <!-- key dots -->
    <g fill="#151515">
      <circle cx="80" cy="169" r="1.5"/><circle cx="95" cy="169" r="1.5"/><circle cx="110" cy="169" r="1.5"/>
      <circle cx="145" cy="169" r="1.5"/><circle cx="160" cy="169" r="1.5"/><circle cx="175" cy="169" r="1.5"/>
      <circle cx="210" cy="169" r="1.5"/><circle cx="225" cy="169" r="1.5"/><circle cx="240" cy="169" r="1.5"/>
      <circle cx="275" cy="169" r="1.5"/><circle cx="290" cy="169" r="1.5"/><circle cx="305" cy="169" r="1.5"/>
    </g>
    <!-- sage centered, all wings out -->
    <g transform="translate(90 -10)">
      <use href="#sage-base"/>
      <!-- 4 wings reaching down to each keyboard -->
      <path d="M 50 120 Q 30 145 -15 165" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 55 130 Q 35 145 50 165" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 145 130 Q 165 145 150 165" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 150 120 Q 170 145 215 165" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- working dots -->
    <text x="180" y="40" font-family="JetBrains Mono, monospace" font-size="20" fill="#F54E00">···</text>
  </symbol>

  <!-- ════════ POSE 7 · NAPPING ════════ -->
  <symbol id="sage-nap" viewBox="0 0 260 200">
    <!-- branch -->
    <path d="M 20 165 Q 100 168 240 162" fill="none" stroke="#7B5C3A" stroke-width="10" stroke-linecap="round"/>
    <path d="M 200 162 L 220 145 L 225 155" fill="none" stroke="#7B5C3A" stroke-width="6" stroke-linecap="round"/>
    <!-- sage with eyes closed -->
    <g transform="translate(40 -20)">
      <!-- body -->
      <ellipse cx="100" cy="125" rx="52" ry="60" fill="#C9A46B" stroke="#151515" stroke-width="3.5"/>
      <ellipse cx="100" cy="140" rx="34" ry="38" fill="#F5E6C9"/>
      <!-- ear tufts -->
      <path d="M 65 75 Q 58 50 72 67" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 135 75 Q 142 50 128 67" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- closed eyes (arcs) -->
      <path d="M 65 100 Q 78 92 90 100" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 110 100 Q 122 92 135 100" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
      <!-- beak -->
      <path d="M 92 113 L 100 122 L 108 113 Z" fill="#F54E00" stroke="#151515" stroke-width="2.5"/>
      <!-- chest lines -->
      <path d="M 88 155 Q 100 160 112 155" fill="none" stroke="#C9A46B" stroke-width="2"/>
    </g>
    <!-- ZZZ -->
    <g fill="#151515" font-family="Caveat, cursive" font-style="italic">
      <text x="195" y="55" font-size="28">z</text>
      <text x="210" y="40" font-size="22">z</text>
      <text x="220" y="25" font-size="16">z</text>
    </g>
  </symbol>

  <!-- ════════ POSE 8 · HOLDING A SIGN ════════ -->
  <symbol id="sage-sign" viewBox="0 0 260 220">
    <!-- sign held up -->
    <g transform="translate(0 -5)">
      <rect x="55" y="20" width="160" height="50" rx="6" fill="#FAF9F4" stroke="#151515" stroke-width="3.5"/>
      <!-- sign post lines (two diagonal sticks from sign to wings) -->
      <line x1="80" y1="70" x2="65" y2="100" stroke="#7B5C3A" stroke-width="5" stroke-linecap="round"/>
      <line x1="190" y1="70" x2="205" y2="100" stroke="#7B5C3A" stroke-width="5" stroke-linecap="round"/>
      <!-- sample headline text on sign (consumer can swap via text overlay; here decorative scribbles) -->
      <line x1="70" y1="40" x2="200" y2="40" stroke="#151515" stroke-width="2"/>
      <line x1="70" y1="50" x2="180" y2="50" stroke="#151515" stroke-width="2"/>
      <!-- yellow highlight bar -->
      <rect x="70" y="56" width="40" height="6" fill="#F9BD2B"/>
    </g>
    <use href="#sage-base-tucked"/>
    <!-- wings raised holding sign -->
    <path d="M 50 100 Q 45 80 70 75" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 150 100 Q 155 80 200 75" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <!-- ════════ POSE 9 · RIBBON (celebration) ════════ -->
  <symbol id="sage-ribbon" viewBox="0 0 260 220">
    <use href="#sage-base-tucked"/>
    <!-- ribbon strip -->
    <path d="M 50 60 L 95 90 L 145 60 L 175 95 L 220 60" fill="none" stroke="#F54E00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- confetti -->
    <g>
      <rect x="40" y="40" width="6" height="3" fill="#F9BD2B" transform="rotate(20 43 41)"/>
      <rect x="200" y="35" width="6" height="3" fill="#29DBBB" transform="rotate(-25 203 36)"/>
      <rect x="120" y="20" width="6" height="3" fill="#1D4AFF" transform="rotate(45 123 21)"/>
      <circle cx="70" cy="30" r="3" fill="#EF4444"/>
      <circle cx="185" cy="20" r="3" fill="#F9BD2B"/>
      <path d="M 240 50 L 248 50 L 244 56 Z" fill="#29DBBB"/>
    </g>
  </symbol>

  <!-- ════════ POSE 10 · CALCULATOR ════════ -->
  <symbol id="sage-calc" viewBox="0 0 260 230">
    <use href="#sage-base-tucked"/>
    <!-- calculator held -->
    <g transform="translate(0 5)">
      <rect x="155" y="120" width="55" height="70" rx="5" fill="#151515"/>
      <rect x="160" y="125" width="45" height="14" rx="2" fill="#F9BD2B"/>
      <text x="200" y="136" font-family="JetBrains Mono, monospace" font-size="10" fill="#151515" text-anchor="end">$149</text>
      <!-- keys -->
      <g fill="#FAF9F4">
        <rect x="162" y="145" width="9" height="9" rx="1"/>
        <rect x="174" y="145" width="9" height="9" rx="1"/>
        <rect x="186" y="145" width="9" height="9" rx="1"/>
        <rect x="198" y="145" width="9" height="9" rx="1"/>
        <rect x="162" y="158" width="9" height="9" rx="1"/>
        <rect x="174" y="158" width="9" height="9" rx="1"/>
        <rect x="186" y="158" width="9" height="9" rx="1"/>
        <rect x="198" y="158" width="9" height="9" rx="1"/>
        <rect x="162" y="171" width="9" height="9" rx="1"/>
        <rect x="174" y="171" width="9" height="9" rx="1"/>
        <rect x="186" y="171" width="9" height="9" rx="1"/>
      </g>
      <rect x="198" y="171" width="9" height="22" rx="1" fill="#F54E00"/>
    </g>
    <!-- wing holding it -->
    <path d="M 152 125 Q 165 135 165 145" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <!-- ════════ POSE 11 · WRENCH (docs) ════════ -->
  <symbol id="sage-wrench" viewBox="0 0 280 220">
    <use href="#sage-base-tucked"/>
    <!-- wrench held in right talon -->
    <g transform="translate(0 0) rotate(-25 200 140)">
      <rect x="190" y="118" width="8" height="55" rx="3" fill="#151515"/>
      <path d="M 184 110 Q 184 100 194 100 L 204 100 Q 214 100 214 110 Q 214 116 208 118 L 208 124 Q 214 126 214 132 Q 214 142 204 142 L 194 142 Q 184 142 184 132 Q 184 126 190 124 L 190 118 Q 184 116 184 110 Z" fill="#C9A46B" stroke="#151515" stroke-width="2.5"/>
    </g>
    <!-- nut/bolt below -->
    <path d="M 220 175 L 225 170 L 235 170 L 240 175 L 235 180 L 225 180 Z" fill="#F9BD2B" stroke="#151515" stroke-width="2"/>
    <circle cx="230" cy="175" r="2" fill="#151515"/>
  </symbol>

  <!-- ════════ POSE 12 · WINKING ════════ -->
  <symbol id="sage-wink" viewBox="0 0 220 220">
    <path d="M 48 110 Q 38 145 62 172" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <!-- body parts (override right eye to a wink) -->
    <ellipse cx="100" cy="115" rx="58" ry="68" fill="#C9A46B" stroke="#151515" stroke-width="3.5"/>
    <ellipse cx="100" cy="130" rx="38" ry="44" fill="#F5E6C9"/>
    <path d="M 60 60 Q 52 38 68 52" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 140 60 Q 148 38 132 52" fill="#C9A46B" stroke="#151515" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- open eye (left) -->
    <circle cx="78" cy="88" r="24" fill="#FAF9F4" stroke="#151515" stroke-width="3.5"/>
    <circle cx="80" cy="90" r="11" fill="#151515"/>
    <circle cx="85" cy="86" r="3.5" fill="#FFFFFF"/>
    <!-- winking eye (right) - curved line -->
    <path d="M 102 92 Q 122 80 142 92" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <!-- beak (slight smile) -->
    <path d="M 92 105 L 100 118 L 108 105 Z" fill="#F54E00" stroke="#151515" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 95 122 Q 100 126 105 122" fill="none" stroke="#151515" stroke-width="2"/>
    <!-- chest lines -->
    <path d="M 90 145 Q 100 150 110 145" fill="none" stroke="#C9A46B" stroke-width="2"/>
    <path d="M 88 155 Q 100 161 112 155" fill="none" stroke="#C9A46B" stroke-width="2"/>
    <!-- feet -->
    <g stroke="#F54E00" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 82 180 L 76 192 M 82 180 L 84 194 M 82 180 L 90 192"/>
      <path d="M 118 180 L 112 192 M 118 180 L 116 194 M 118 180 L 124 192"/>
    </g>
    <!-- right wing thumbs-up gesture -->
    <path d="M 158 95 Q 175 75 165 60" fill="none" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="166" cy="60" r="6" fill="#C9A46B" stroke="#151515" stroke-width="2.5"/>
  </symbol>

</svg>
