<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — Seenfolio</title>
<link rel="stylesheet" href="styles.css" />
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
.shell { max-width: 460px; width: 100%; background: var(--bg-card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); padding: 40px 44px; }
.shell .brand { margin-bottom: 28px; }
.shell h1 { font-family: var(--font-sans); font-size: 36px; font-variation-settings: "wght" 800; letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 14px; }
.shell h1 em { font-style: normal; background: var(--yellow); padding: 0 6px; }
.shell p { font-family: var(--font-sans); font-size: 16px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 28px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 8px; }
.form-input { width: 100%; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 12px; background: var(--bg); font-family: var(--font-sans); font-size: 16px; outline: none; }
.form-input:focus { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }
.shell .btn { width: 100%; justify-content: center; padding: 14px; font-size: 16px; }
.shell .footer-link { text-align: center; margin-top: 22px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); }
.shell .footer-link a { color: var(--accent); border-bottom: 1.5px solid var(--accent); }
.success { display: none; padding: 22px 24px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 14px; margin-bottom: 18px; box-shadow: var(--shadow-card); }
.success.visible { display: block; }
.success h3 { font-family: var(--font-sans); font-size: 20px; font-variation-settings: "wght" 800; margin: 0 0 8px; }
.success p { color: var(--ink); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<main class="shell">
  <a class="brand" href="index.html">
    <div class="brand-mark"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><ellipse cx="9" cy="11" rx="7" ry="9.5" fill="#E9C000"/><ellipse cx="21" cy="11" rx="8.5" ry="10.5" fill="#E9C000"/></svg></div>
    <div class="brand-name">Seenfolio</div>
  </a>
  <div class="success" data-success>
    <h3>Check your inbox.</h3>
    <p>We sent a reset link to that email. Expires in 30 minutes. — Sage 🦉</p>
  </div>
  <div data-form>
    <h1>Forgot your <em>password</em>?</h1>
    <p>Drop your email. We'll send a reset link. The link expires in 30 minutes.</p>
    <div class="form-group">
      <label>Email</label>
      <input class="form-input" type="email" placeholder="amara@silverjewelry.com" />
    </div>
    <button class="btn primary" data-submit>Send reset link →</button>
    <p class="footer-link">Remembered it? <a href="sign-in.html">Sign in →</a></p>
  </div>
</main>
<script>
  document.querySelector('[data-submit]').addEventListener('click', () => {
    document.querySelector('[data-form]').style.display = 'none';
    document.querySelector('[data-success]').classList.add('visible');
  });
</script>
</body>
</html>
